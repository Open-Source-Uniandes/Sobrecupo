<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://open-source-uniandes.github.io/Aula-Finder/">
    <link rel="canonical" href="https://open-source-uniandes.github.io/Aula-Finder/">
    <title>Redirigiendo a Aula-Finder...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sobrecupo ➡️ Aula-Finder</h1>
        <p>Este proyecto ha migrado a un nuevo nombre.</p>
        <div class="spinner"></div>
        <p>Redirigiendo automáticamente...</p>
        <p>Si no eres redirigido automáticamente, haz clic aquí:</p>
        <a href="https://open-source-uniandes.github.io/Aula-Finder/">Ir a Aula-Finder</a>
    </div>
    <script>
        // JavaScript redirect as fallback
        setTimeout(function() {
            window.location.href = "https://open-source-uniandes.github.io/Aula-Finder/";
        }, 100);
    </script>
</body>
</html>
